name: deploy-oceantwin-pages
# Pages is enabled; this workflow publishes the verified static fail-safe build.

on:
  push:
    branches:
      - final-mvp-react-cesium-fastapi
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: oceantwin-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scientific export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Export canonical scientific API as static evidence
        run: python scripts/export_static_science.py --output frontend/public/science-static

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Typecheck judge-facing application
        working-directory: frontend
        run: npm run typecheck

      - name: Build static production application
        working-directory: frontend
        env:
          VITE_STATIC_SCIENCE: "true"
        run: npm run build

      - name: Verify deployment artifact
        run: |
          test -s frontend/dist/index.html
          test -s frontend/dist/science-static/manifest.json
          test -s frontend/dist/science-static/catalog.json
          test -s frontend/dist/science-static/profiles/index.json
          test -s frontend/dist/cesiumStatic/Assets/Textures/NaturalEarthII/0/0/0.jpg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy OceanTwin to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
